server:
  port: 9999

spring:
  data:
    redis:
      repositories:
        enabled: false
  security:
    enabled: false

  datasource:
    url: ${BOOK_DB_URL}
    username: ${BOOK_DB_USER}
    password: ${BOOK_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

jwt:
  signerKey: ${BOOK_JWT_SIGNER_KEY}
  valid-duration: 8640  # 1 ngay
  refreshable-duration: 86400 # 1 tuan

sms:
 key: ${BOOK_SMS_KEY:}
 device: ${BOOK_SMS_DEVICE:}

